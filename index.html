<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2320">
<title>Absen — Proyek Sport Science USU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Halaman absen untuk HP: satu kolom, tombol besar, jam dari server. */
:root {
  --bg: #f4f5f2; --card: #fff; --line: #e2e4de; --ink: #1d2320; --muted: #6f766f; --accent: #e8771c;
  --hadir: #2e9a5b; --telat: #2f6db5; --tidak: #c62f28; --sakit: #d6336c; --izin: #7a4cc4; --cuti: #d9930d;
  --display: "Oswald", "Arial Narrow", sans-serif; --body: "Barlow", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.4 var(--body); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 480px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.top .proj { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; line-height: 1.15; }
.top .tgl { font-size: 13px; color: var(--muted); margin-top: 2px; }
.top .jam { font-family: var(--mono); font-weight: 600; font-size: 26px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }

.me { display: flex; align-items: center; gap: 12px; }
.ava { flex: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: #e8ebe5; position: relative; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 20px; color: #9aa199; }
.ava img { position: absolute; left: -37.5%; width: 175%; margin-top: -27%; top: 0; }
.me .who { flex: 1; min-width: 0; }
.me b { display: block; font-size: 19px; line-height: 1.15; }
.me span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.link { border: 0; background: none; padding: 6px 0; color: var(--telat); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.state { --c: #9aa199; border-left: 6px solid var(--c); display: flex; flex-direction: column; gap: 6px; }
.state .lbl { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.state .big { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; color: var(--c); text-transform: uppercase; letter-spacing: .02em; }
.state .det { font-size: 15px; }
.state .det b { font-variant-numeric: tabular-nums; }
.state.hadir { --c: var(--hadir); } .state.telat { --c: var(--telat); } .state.tidak { --c: var(--tidak); }
.state.sakit { --c: var(--sakit); } .state.izin { --c: var(--izin); } .state.cuti { --c: var(--cuti); }

.rules { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; margin-top: 4px; }
.rules .t { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rules .now { background: #fff4e5; border-radius: 4px; margin: 0 -6px; padding: 0 6px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 3px 10px; border-radius: 99px; background: #eef0ec; color: var(--ink); }

.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; padding: 14px 18px; border: 0; border-radius: 12px; font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
.btn.main { background: var(--accent); color: #fff; min-height: 72px; font-size: 21px; box-shadow: 0 6px 18px rgba(232,119,28,.28); }
.btn.sec { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.btn.dark { background: var(--ink); color: #fff; }
.btn:disabled { opacity: .5; cursor: progress; }
.btn svg { width: 22px; height: 22px; }
.note { font-size: 13px; color: var(--muted); text-align: center; }
.warn { background: #fdeceb; color: #9b2620; border: 1px solid #f3c9c6; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
.ok { background: #e7f4ec; color: #1f6e41; border: 1px solid #bfe3cc; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
.row2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.list { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 0; padding: 0; list-style: none; }
.list li { font-size: 14px; padding: 8px 10px; border-radius: 8px; background: #f6f7f4; }
.list li b { font-family: var(--mono); margin-right: 6px; }
h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .03em; text-transform: uppercase; }

/* Pilih nama */
.search { width: 100%; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 16px; }
.names { display: flex; flex-direction: column; gap: 6px; }
.names button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; width: 100%; padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.names b { font-size: 17px; }
.names span { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

/* Lembar isian */
.sheet { position: fixed; inset: 0; z-index: 10; background: rgba(29,35,32,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet .panel { width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; background: var(--card); border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.seg button { padding: 12px 8px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }
.hint { font-size: 13px; color: var(--muted); }
.hint b { color: var(--ink); }
.msg { color: var(--tidak); font-size: 14px; font-weight: 600; min-height: 1em; white-space: pre-line; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; width: min(440px, calc(100% - 32px)); background: var(--ink); color: #fff; padding: 14px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.spin { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; }
.btn.sec .spin { border-color: rgba(0,0,0,.15); border-top-color: var(--ink); }
@keyframes sp { to { transform: rotate(360deg); } }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
</style>
<script>/* Penangkap galat: bila script utama gagal, pesan galat tampil di layar (bukan "Memuat…" selamanya) */
window.onerror = function (m, s, l, c) { var e = document.getElementById('loading'); if (e) { e.hidden = false; e.innerHTML = '<p style="color:#c62f28;font-weight:600">Halaman gagal dimuat: ' + String(m).replace(/</g, '&lt;') + ' (baris ' + l + ':' + c + '). Kirim screenshot ini ke admin.</p>'; } };</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="proj" id="proj"></div><div class="tgl" id="tgl"></div></div>
    <div class="jam" id="jam">--:--</div>
  </header>

  <div class="loading" id="loading">Memuat…</div>

  <!-- Pilih nama (sekali, lalu diingat HP) -->
  <section id="pilih" hidden>
    <h2>Pilih nama Anda</h2>
    <p class="hint" style="margin:6px 0 12px">Cukup sekali. HP ini akan mengingat nama Anda. Satu HP hanya bisa dipakai absen untuk satu orang per hari.</p>
    <input class="search" id="cari" type="search" placeholder="Ketik nama…" autocomplete="off">
    <div class="names" id="names" style="margin-top:10px"></div>
  </section>

  <!-- Halaman utama -->
  <section id="utama" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="me">
      <div class="ava" id="ava"></div>
      <div class="who"><b id="nama"></b><span id="jabatan"></span></div>
    </div>
    <div class="warn" id="hpLain" hidden></div>
    <div class="card state" id="state"></div>
    <div id="aksi" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="card" id="lemburBox" hidden>
      <div class="row2"><h2>Lembur hari ini</h2></div>
      <ul class="list" id="lemburList"></ul>
    </div>
    <div class="card" id="cutiBox" hidden></div>
    <p class="note" id="kaki">Jam absen memakai jam server, bukan jam HP.</p>
  </section>
</div>

<!-- Lembar isian -->
<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" id="panel"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Halaman ini di-hosting di luar Google supaya HP yang login ke beberapa akun Google tetap bisa absen.
   Data dikirim ke Apps Script tanpa cookie Google (credentials: 'omit'). */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzow8y4qB557PUskQcZaB8OptFLsrvrQGeMDvbVuFIw5LgBQPLONyUvfXTU6lnWIQ8Nsg/exec';
let CFG = null, A = null;
function api(fn, ...args) {
  return fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args, ua: navigator.userAgent }), credentials: 'omit', redirect: 'follow' })
    .catch(() => { throw new Error('Gagal terhubung ke server. Periksa sinyal internet, lalu coba lagi.'); })
    .then(r => r.json())
    .then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesan = e => String((e && e.message) || e || 'Terjadi kesalahan.').replace(/^Error:\s*/, '');
const kode = e => { const m = pesan(e).match(/^([A-Z_]+)\|(.*)$/s); return m ? { kode: m[1], teks: m[2] } : { kode: '', teks: pesan(e) }; };
const titik = hm => String(hm || '').replace(':', '.');
const simpan = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const baca = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

/* Identitas perangkat: acak, dibuat sekali, disimpan di HP. */
let DEV = baca('absen_dev');
if (!DEV || !/^[a-z0-9-]{12,48}$/.test(DEV)) {
  DEV = 'd-' + ((crypto.randomUUID && crypto.randomUUID()) || (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2))).toLowerCase().replace(/[^a-z0-9-]/g, '');
  simpan('absen_dev', DEV);
}
let ID = baca('absen_id'), INFO = null, SELISIH = 0;   // SELISIH = menit (server - HP)


/* Jam: mengikuti server (selisih dihitung dari jam server terakhir). */
function jamServer() { const d = new Date(Date.now() + SELISIH * 60000); return d; }
const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
function tick() { $('jam').textContent = hm(jamServer()).replace(':', '.'); }
setInterval(tick, 1000); tick();

function toast(t, ms = 4200) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, ms); }

/* ---------- Browser di dalam aplikasi (WhatsApp, Google, Instagram, pemindai QR, dll.) ----------
   Penyimpanannya terpisah dari Chrome/Safari (HP dianggap baru → nama ditolak) dan sering tanpa izin lokasi.
   Sebelum memilih nama, staf diminta pindah ke Chrome/Safari. */
const UA = navigator.userAgent || '';
const IOS = /iPhone|iPad|iPod/.test(UA);
// Catatan: hindari dua garis miring berurutan di dalam teks/regex. Apps Script menganggapnya komentar
// dan memotong sisa baris (halaman jadi gagal dimuat).
const DALAM_APP = /GSA\/|; wv\)|WhatsApp|FBAN|FBAV|FB_IAB|Instagram|\bLine\/|Telegram|TikTok|musical_ly/i.test(UA) || (IOS && !/Safari\/\d/.test(UA));
let TETAP_DI_SINI = false;
function peringatanAplikasi() {
  const url = location.href.split('#')[0];
  const chrome = `intent:\/\/${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(url)};end`;
  let box = $('appWarn');
  if (!box) { box = document.createElement('div'); box.id = 'appWarn'; box.style.cssText = 'display:flex;flex-direction:column;gap:10px'; $('names').before(box); }
  $('names').innerHTML = ''; box.hidden = false;
  box.innerHTML = `<div class="warn" style="display:flex;flex-direction:column;gap:10px;font-weight:600">
      <span>Halaman ini terbuka <b>di dalam aplikasi</b> (mis. WhatsApp, Google, atau pemindai QR). Di sini nama Anda bisa ditolak dan lokasi sering tidak terbaca.</span>
      <span style="font-weight:400">${IOS ? 'Ketuk ikon <b>⋯</b> atau <b>kompas</b> di pojok layar → <b>Buka di Safari</b>. Atau salin link lalu tempel di Safari.'
        : 'Ketuk tombol di bawah untuk membuka di <b>Chrome</b>. Lain kali, pindai QR poster langsung dengan <b>aplikasi Kamera</b>.'}</span></div>
    ${IOS ? '' : `<a class="btn main" href="${chrome}" style="text-decoration:none;display:flex;align-items:center;justify-content:center">Buka di Chrome</a>`}
    <button class="btn sec" type="button" id="salinLink">Salin link</button>
    <button class="link" type="button" id="tetap" style="align-self:center">Tetap lanjutkan di sini (tidak disarankan)</button>`;
  $('salinLink').onclick = () => { try { navigator.clipboard.writeText(url).then(() => toast('Link disalin. Tempel di ' + (IOS ? 'Safari' : 'Chrome') + '.'), () => prompt('Salin link ini:', url)); } catch (e) { prompt('Salin link ini:', url); } };
  $('tetap').onclick = () => { TETAP_DI_SINI = true; box.hidden = true; $('cari').hidden = false; tampilPilih(); };
}

/* ---------- Pilih nama ---------- */
let DAFTAR = [];
function tampilPilih() {
  $('loading').hidden = true; $('utama').hidden = true; $('pilih').hidden = false;
  if (DALAM_APP && !TETAP_DI_SINI) { $('cari').hidden = true; return peringatanAplikasi(); }
  if (DAFTAR.length) return isiNama();
  $('names').innerHTML = '<p class="hint">Memuat daftar…</p>';
  api('absenDaftar').then(d => { DAFTAR = d; isiNama(); }).catch(e => { $('names').innerHTML = `<p class="msg">${esc(pesan(e))}</p>`; });
}
function isiNama() {
  const q = $('cari').value.trim().toLowerCase();
  const list = DAFTAR.filter(s => !q || (s.nama + ' ' + s.jabatan).toLowerCase().includes(q));
  $('names').innerHTML = list.map(s => `<button type="button" data-id="${esc(s.id)}"><b>${esc(s.nama)}</b><span>${esc(s.jabatan || '—')}</span></button>`).join('')
    || '<p class="hint">Nama tidak ditemukan. Hubungi admin bila nama Anda belum ada.</p>';
}
$('cari').addEventListener('input', isiNama);
$('names').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  const s = DAFTAR.find(x => x.id === b.dataset.id);
  bukaLembar(`<h2>Konfirmasi</h2><p style="margin:0;font-size:17px">Saya <b>${esc(s.nama)}</b><br><span class="hint">${esc(s.jabatan)}</span></p>
    <p class="warn" style="margin:0">Setelah ini HP terkunci untuk nama ini dan <b>tidak bisa diganti sendiri</b>. Pastikan nama sudah benar.</p>
    <p class="hint">Mengabsenkan orang lain dilarang dan tercatat di riwayat beserta perangkatnya.</p>
    <button class="btn main" id="ya" type="button">Ya, ini saya</button><button class="btn sec" data-tutup type="button">Bukan</button>`);
  $('ya').onclick = () => { ID = s.id; simpan('absen_id', ID); tutupLembar(); muat(); };
});


/* ---------- Muat & tampilkan keadaan ---------- */
function muat() {
  if (!ID) return tampilPilih();
  return api('absenInfo', DEV, ID).then(d => {
    INFO = d;
    A = Object.assign({}, CFG.aturan, d.aturan || {});    // aturan jam per orang (staf / mahasiswa magang)
    const [h, m] = d.jam.split(':').map(Number), now = new Date();
    SELISIH = (h * 60 + m) - (now.getHours() * 60 + now.getMinutes());
    if (Math.abs(SELISIH) > 720) SELISIH = 0;
    tick(); tampil();
  }).catch(e => {
    const k = kode(e);
    if (k.kode === 'NAMA_TIDAK_ADA') { ID = null; simpan('absen_id', null); toast(k.teks); return tampilPilih(); }
    if (k.kode === 'HP_TERDAFTAR') {                        // HP ini milik nama lain: kembali ke nama pemiliknya
      const [milik, teks] = [k.teks.split('|')[0], k.teks.split('|').slice(1).join('|')];
      ID = milik; simpan('absen_id', ID); toast(teks, 7000); return muat();
    }
    if (k.kode === 'NAMA_TERDAFTAR') {
      ID = null; simpan('absen_id', null);
      $('loading').hidden = true; $('utama').hidden = true; $('pilih').hidden = true;
      bukaLembar(`<h2>Nama sudah terdaftar</h2><p style="margin:0">${esc(k.teks)}</p><button class="btn sec" data-tutup type="button" id="okNama">Mengerti</button>`);
      $('okNama').addEventListener('click', tampilPilih);
      return;
    }
    $('loading').hidden = false; $('loading').innerHTML = `<p class="msg">${esc(k.teks)}</p><button class="btn sec" type="button" onclick="muat()">Coba lagi</button>`;
  });
}
let fotoDiminta = '';
function tampil() {
  const d = INFO, s = d.status;
  $('loading').hidden = true; $('pilih').hidden = true; $('utama').hidden = false;
  $('tgl').textContent = d.tanggal;
  $('nama').textContent = d.staf.nama; $('jabatan').textContent = d.staf.jabatan || '—';
  if (fotoDiminta !== d.staf.id) {
    fotoDiminta = d.staf.id;
    $('ava').textContent = d.staf.nama.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    if (!window.PREVIEW) api('fotoSaya', d.staf.id, DEV).then(f => { if (f && f.url) $('ava').innerHTML = `<img alt="" src="${f.url}">`; }).catch(() => {});
  }
  $('hpLain').hidden = !d.hpLain;
  $('hpLain').textContent = d.hpLain ? `HP ini hari ini sudah dipakai absen atas nama ${d.hpLain}. Satu HP hanya untuk satu orang per hari.` : '';

  const now = hm(jamServer());
  const masuk = !!(s && s.hadir);                    // absen HP (ada jam datang) atau dicatat Hadir/Terlambat oleh admin
  const keg = d.kegiatan.length ? d.kegiatan.join(' / ') : '';
  let cls = '', lbl = 'Status hari ini', big = 'Belum absen', det = '';
  if (s) {
    const tidakIkut = s.absen && s.absen.length ? `Tidak ikut ${esc(s.absen.join(' · '))}` : '';
    if (s.status === 'Hadir') { cls = 'hadir'; big = 'Hadir'; det = `${s.datang ? `Masuk <b>${titik(s.datang)}</b>` : 'Dicatat oleh admin'}${tidakIkut ? ' · ' + tidakIkut : ''}${s.ket ? `<br>Alasan: ${esc(s.ket)}` : ''}`; }
    else if (s.status === 'Terlambat') {
      cls = 'telat'; big = s.hadir ? 'Terlambat' : 'Akan terlambat';
      det = s.hadir ? `${s.datang ? `Masuk <b>${titik(s.datang)}</b>` : 'Dicatat oleh admin'} · ${esc(s.ket)}${tidakIkut ? '<br>' + tidakIkut : ''}`
                    : `${esc(s.ket)}<br><b>Jangan lupa absen masuk begitu tiba.</b>`;
    }
    else if (s.status === 'Sakit') { cls = 'sakit'; big = 'Sakit'; det = [esc(s.penyakit), esc(s.progres), s.lanjut ? 'lanjutan — perbarui bila perlu' : ''].filter(Boolean).join(' · '); }
    else if (s.status === 'Izin') { cls = 'izin'; big = 'Izin'; det = esc(s.ket); }
    else if (s.status === 'Cuti') {
      cls = 'cuti'; big = 'Cuti';
      const kembali = s.mulai ? tglPanjang(tambahHari(s.mulai, d.lamaCuti)) : '';

/* Lokasi HP. Absen masuk: wajib (bila diatur di server). Laporan & lembur: dicoba, tidak wajib, tetap dicatat. */
function ambilLokasi(batasMs = 10000) {
  if (!A.lokasi) return Promise.resolve(null);
  return new Promise(res => {
    if (!navigator.geolocation) return res({ err: 'tidak didukung' });
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
      e => res({ err: e.code === 1 ? 'izin ditolak' : e.code === 3 ? 'waktu habis' : (e.message || 'kode ' + e.code) }),
      { enableHighAccuracy: true, timeout: batasMs, maximumAge: 30000 });
  });
}
const BANTU_LOKASI = /iPhone|iPad|iPod/.test(navigator.userAgent) ? `<div class="hint" style="background:#fff4e5;border-radius:10px;padding:10px 12px;margin-top:4px">
  <b>Cara mengizinkan lokasi di iPhone:</b><br>1. Pengaturan → Privasi &amp; Keamanan → <b>Layanan Lokasi</b> → Aktif.<br>
  2. Di daftar yang sama: <b>Situs Web Safari</b> (atau <b>Chrome</b>) → <b>Saat Menggunakan App</b>, nyalakan <b>Lokasi Tepat</b>.<br>
  3. Di Safari, ketuk <b>aA</b> di kolom alamat → Pengaturan Situs Web → <b>Lokasi → Izinkan</b>.<br>Lalu tekan Absen masuk lagi. Di dalam gedung, coba dekat jendela atau di luar.</div>`
  : `<div class="hint" style="background:#fff4e5;border-radius:10px;padding:10px 12px;margin-top:4px">
  <b>Cara mengizinkan lokasi:</b> ketuk ikon di kiri alamat situs (⚙/gembok) → <b>Izin</b> / <b>Setelan situs</b> → <b>Lokasi</b> → <b>Izinkan</b>.
  Pastikan juga <b>Lokasi/GPS HP menyala</b>, lalu tekan Absen masuk lagi. Di dalam gedung, coba dekat jendela atau di luar.</div>`;

function urlWa(a) { return 'https:\/\/wa.me\/' + (a.wa || '') + '?text=' + encodeURIComponent(a.teks); }

  const w = x.setuju === 'Disetujui' ? '#2e9a5b' : x.setuju === 'Ditolak' ? '#c62f28' : '#b26a00';
  return ` <span class="chip" style="background:${w}1a;color:${w}">${esc(x.setuju)}${x.atasan && x.setuju !== 'Menunggu' ? ' · ' + esc(x.atasan) : ''}</span>${x.catatanAtasan ? `<div class="hint" style="margin:2px 0 0">Catatan atasan: ${esc(x.catatanAtasan)}</div>` : ''}`;
}

  if (perlu) return formAlasan(now > A.batasHadir ? 'telat' : 'kegiatan');

function formAlasan(jenis) {

    .filter(x => x !== 'Ikut tapi telat absen' || (INFO.kegiatan.length && (!A.ikutTelatSampai || hm(jamServer()) <= A.ikutTelatSampai))).concat(['Lainnya']);

    <div class="field" style="margin:0 0 4px">Pilih alasan</div>

    <label class="field" id="fLain" hidden><span id="lLain">Tulis alasan Anda</span><textarea id="alasan" maxlength="110" placeholder="Mis. bangun kesiangan, antar anak sekolah"></textarea></label>
    <div class="msg" id="lm" style="margin:8px 0 14px"></div>

    b.onclick = () => {
      pilih = b.dataset.alasan; $('lm').textContent = '';

        const on = x === b; x.style.background = on ? 'var(--ink)' : ''; x.style.color = on ? '#fff' : ''; x.style.borderColor = on ? 'var(--ink)' : '';
      });
      const isi = pilih === 'Lainnya' || pilih === 'Urusan keluarga';

      $('alasan').placeholder = pilih === 'Urusan keluarga' ? 'Mis. antar orang tua berobat, anak sakit' : 'Mis. bangun kesiangan, ban bocor';
      if (isi) setTimeout(() => $('alasan').focus(), 50);
    };
  });
  const KOSONG = /^(i+y+a+h*|y+a+h*|o+k+[aeiouy]*h*|h+a+d+i+r+|s+i+a+p+|s+i+p+|b+a+i+k+|k+e+p+o+|t+e+s+t*)+$/;

    if (huruf.length < 5) return void ($('lm').textContent = pilih === 'Urusan keluarga' ? 'Tulis urusan keluarga apa.' : 'Tulis alasan lebih jelas (minimal 5 huruf).');
    absenMasuk(pilih + ': ' + a, $('ya'));
  };
}
function absenMasuk(alasan, btn) {
  sibuk(btn, true);
  ambilLokasi(12000).then(lok => api('absenMasuk', DEV, ID, alasan, lok)).then(r => {
    tutupLembar();
    const extra = r.absen && r.absen.length ? ` · tidak ikut ${r.absen.join(', ')}` : '';
    toast(`${r.status === 'Hadir' ? 'Absen masuk tercatat' : 'Tercatat terlambat'} pukul ${r.jam}${extra}.`);
    return muat();
  }).catch(e => {
    sibuk(btn, false);
    const k = kode(e);
    if (k.kode === 'PERLU_ALASAN') return formAlasan(/terlambat/.test(k.teks) ? 'telat' : 'kegiatan');
    if (k.kode === 'PULANG_TERTUNDA') { tutupLembar(); return muat().then(formPulangTertunda); }
    if (k.kode === 'ISTIRAHAT') { tutupLembar(); return muat().then(() => INFO.istirahat ? pesanIstirahat(INFO.istirahat) : toast(k.teks)); }
    if (k.kode === 'LEMBUR_TIDAK_ADA') {
      bukaLembar(`<h2>Hubungi admin</h2><p style="margin:0">${esc(k.teks)}</p><button class="btn sec" data-tutup type="button">Tutup</button>`);
      return;
    }
    if (k.kode === 'LOKASI') {
      bukaLembar(`<h2>Absen ditolak</h2><p style="margin:0">${esc(k.teks)}</p>${BANTU_LOKASI}
        <button class="btn main" id="ulang" type="button">Coba lagi</button><button class="btn sec" data-tutup type="button">Tutup</button>`);
      $('ulang').onclick = () => absenMasuk(alasan, $('ulang'));
      return;
    }
    if ($('lm')) $('lm').textContent = k.teks; else toast(k.teks, 6000);
  });
}

  };
  const hitungKembali = () => { const m = $('mulai').value; $('kembali').innerHTML = m ? `Kembali bekerja <b>${esc(tglPanjang(tambahHari(m, INFO.lamaCuti)))}</b>` : ''; };
  if ($('seg')) $('seg').onclick = e => { const b = e.target.closest('[data-j]'); if (b) atur(b.dataset.j); };
  $('penyakit').onchange = () => { $('fLain').hidden = $('penyakit').value !== 'Lainnya'; };
  $('mulai').oninput = hitungKembali;
  if (!bisaHariIni && !cutiSaja) { /* hanya cuti ke depan yang masih bisa */ }
  atur(jenis);
  $('ya').onclick = () => {
    const d = { jenis, ket: $('ket').value.trim() };
    if (jenis === 'Sakit') { d.penyakit = $('penyakit').value; d.lain = $('lain').value.trim(); d.progres = $('progres').value;
      if (!d.penyakit) return void ($('lm').textContent = 'Pilih jenis sakit.');
      if (d.penyakit === 'Lainnya' && d.lain.length < 3) return void ($('lm').textContent = 'Sebutkan jenis sakitnya.'); }
    if ((jenis === 'Izin' || jenis === 'Telat') && d.ket.length < 3) return void ($('lm').textContent = 'Keterangan wajib diisi.');
    if (jenis === 'Cuti') { d.mulai = $('mulai').value; if (!d.mulai) return void ($('lm').textContent = 'Pilih tanggal mulai cuti.'); }
    kirim($('ya'), () => ambilLokasi(6000).then(lok => api('absenLapor', DEV, ID, d, lok)), r => r.pesan);
  };
}

/* ---------- Lembur ---------- */
/* ---------- Absen pulang (wajib di lokasi proyek; sebelum jam pulang = pulang cepat + alasan) ---------- */
function formPulang() {
  const now = hm(jamServer()), jamPulang = A.pulang || '17:00', cepat = now < jamPulang;
  bukaLembar(`<h2>Absen pulang</h2>
    <p class="hint">${cepat ? `Belum pukul ${titik(jamPulang)}: tercatat <b>Pulang cepat</b>, alasan wajib.` : 'Pastikan Anda masih di lokasi proyek.'} Lokasi HP diperlukan.</p>
    ${cepat ? '<label class="field">Alasan pulang cepat<textarea id="alasan" maxlength="150" placeholder="Mis. izin keperluan keluarga, sudah disetujui atasan"></textarea></label>' : ''}
    <div class="msg" id="lm"></div>
    <button class="btn main" id="ya" type="button">Absen pulang sekarang</button><button class="btn sec" data-tutup type="button">Batal</button>`);
  $('ya').onclick = () => {
    const a = cepat ? $('alasan').value.trim() : '';
    if (cepat && a.length < 5) { $('lm').textContent = 'Tulis alasan pulang cepat (minimal 5 huruf).'; return; }
    kirimPulang(a, $('ya'));
  };
}
/* ---------- Pesan setelah absen pulang: hati-hati di jalan + waktu istirahat + pengingat besok ---------- */
function lamaTeks(m) {
  const h = Math.floor(m / 60), j = h % 24, d = Math.floor(h / 24), n = m % 60;
  return [d ? d + ' hari' : '', j ? j + ' jam' : '', n && !d ? n + ' menit' : ''].filter(Boolean).join(' ') || '0 menit';
}
function pesanPulang(r) {
  const b = r.besok, depan = esc(String(r.nama || '').split(' ')[0]);
  const salam = r.status === 'Pulang cepat' ? 'Semoga urusannya lancar.' : r.status === 'Pulang lewat tengah malam' ? 'Terima kasih sudah lembur sampai larut.' : 'Terima kasih atas kerja kerasnya hari ini.';
  let isi = `<h2>Hati-hati di jalan, ${depan}!</h2>
    <p style="margin:0 0 12px">${esc(r.status)} tercatat pukul <b>${esc(r.jam)}</b>. ${salam}</p>`;
  if (!b) { bukaLembar(isi + `<button class="btn main" data-tutup type="button">Oke</button>`); return; }
  if (b.cuti) {
    isi += `<p style="margin:0 0 12px">Cuti Anda mulai <b>${esc(b.tanggal)}</b>. Selamat beristirahat bersama keluarga.</p>`;
  } else {
    const kapan = b.libur ? 'hari kerja berikutnya' : b.hariIni ? 'nanti pagi' : 'besok';
    const keg = b.kegiatan.length ? b.kegiatan.join(' / ') : '';
    let aturan;
    if (keg) aturan = `Datang paling lambat <b>${titik(b.masuk)}</b> untuk ikut ${esc(keg)}. Lewat ${titik(b.batasHadir)} tercatat <b>Terlambat</b>.`;
    else if (b.magang) aturan = `Datang paling lambat <b>${titik(b.masuk)}</b> (toleransi sampai ${titik(b.batasHadir)}). Lewat itu tercatat <b>Terlambat</b>.`;
    else aturan = `Datang paling lambat <b>${titik(b.batasHadir)}</b>. Lewat itu tercatat <b>Terlambat</b>.`;
    isi += `${b.libur ? `<p style="margin:0 0 12px">Besok libur. Hari kerja berikutnya <b>${esc(b.tanggal)}</b>.</p>` : ''}
      <div style="background:#fff4e5;border-radius:14px;padding:14px 16px;margin:0 0 12px">
        <div class="hint" style="margin:0">Waktu istirahat Anda</div>
        <div style="font-family:var(--display);font-size:34px;font-weight:600;color:var(--accent);line-height:1.15">${lamaTeks(b.menit)}</div>
        <div class="hint" style="margin:0">${b.mulaiMasuk ? `sampai absen masuk berikutnya bisa dilakukan, pukul ${titik(b.mulaiMasuk)}` : `sampai jam masuk ${kapan}${b.libur ? '' : ', ' + esc(b.tanggal)}, pukul ${titik(b.masuk)}`}</div>
      </div>
      <p style="margin:0 0 8px">${b.mulaiMasuk ? `Karena lembur, absen masuk berikutnya paling cepat pukul <b>${titik(b.mulaiMasuk)}</b> (${b.jeda} jam setelah absen pulang).` : `Absen dibuka pukul ${titik(b.buka)}. ${aturan}`}</p>`;
    if (b.lemburStatus && b.lemburStatus.indexOf('Tidak diakui') === 0) {
      isi += `<p class="msg" style="margin:0 0 8px">Lembur hari ini <b>tidak diakui</b>: ${esc(b.lemburStatus.replace(/^Tidak diakui · /, ''))}. Hubungi admin bila ada kekeliruan.</p>`;
    } else if (b.lemburStatus && b.lemburStatus !== 'Diakui') {
      isi += `<p class="hint" style="margin:0 0 8px">Anda pulang lebih awal dari estimasi selesai lembur, jadi jam lembur <b>dihitung sampai jam absen pulang</b>.</p>`;
    } else if (b.menit < 480) {
      isi += b.lembur
        ? `<p class="hint" style="margin:0 0 8px">Lembur sudah tercatat dan diakui. Kalau ${b.hariIni ? 'nanti pagi' : 'besok'} terlambat karena lembur, tulis alasannya saat absen masuk.</p>`
        : `<p class="msg" style="margin:0 0 8px">Pulang larut? Kalau tadi lembur, isi lembur sekarang. Tanpa catatan lembur, alasan terlambat karena lembur besok akan ditolak.</p>
           <button class="btn dark" id="pLembur" type="button">Isi lembur sekarang</button>`;
    }
    if (b.mulaiMasuk) isi += `<p style="margin:0 0 12px"><b>Istirahat yang cukup. Jangan lupa absen masuk mulai pukul ${titik(b.mulaiMasuk)}.</b></p>`;
    else isi += `<p style="margin:0 0 12px"><b>Istirahat yang cukup, jangan lupa absen masuk ${b.libur ? 'hari ' + esc(b.tanggal.split(',')[0]) + ' pagi' : b.hariIni ? 'nanti pagi' : 'besok pagi'}, dan jangan sampai terlambat.</b></p>`;
  }
  bukaLembar(isi + `<button class="btn main" data-tutup type="button">Siap, sampai ${b.cuti ? 'jumpa lagi' : b.libur ? 'jumpa' : b.hariIni ? 'nanti pagi' : 'besok'}!</button>`);
  if ($('pLembur')) $('pLembur').onclick = formLembur;
}
function kirimPulang(alasan, btn) {
  sibuk(btn, true);
  ambilLokasi(12000).then(lok => api('absenPulang', DEV, ID, alasan, lok)).then(r => {
    pesanPulang(r); return muat();
  }).catch(e => {
    sibuk(btn, false);
    const k = kode(e);
    if (k.kode === 'LOKASI') {
      bukaLembar(`<h2>Absen pulang ditolak</h2><p style="margin:0">${esc(k.teks)}</p>${BANTU_LOKASI}
        <button class="btn main" id="ulang" type="button">Coba lagi</button><button class="btn sec" data-tutup type="button">Tutup</button>`);
      $('ulang').onclick = () => kirimPulang(alasan, $('ulang'));
      return;
    }
    if (k.kode === 'PERLU_ALASAN') return formPulang();
    if ($('lm')) $('lm').textContent = k.teks; else toast(k.teks, 6000);
  });
}
function formLembur() {
  const jenis = (CFG.jenisLembur || []);
  const now = hm(jamServer());
  bukaLembar(`<h2>Isi lembur</h2><p class="hint">Isi setiap kali lembur. Jam selesai boleh perkiraan.<br><b>Jam lembur dihitung sampai jam Anda absen pulang. Tanpa absen pulang, lembur tidak diakui.</b></p>
    ${jenis.length ? `<label class="field">Jenis lembur<select id="jenis"><option value="">Pilih…</option>${jenis.map(j => `<option>${esc(j)}</option>`).join('')}</select></label>` : ''}
    <label class="field">Pekerjaan lembur<textarea id="ket" maxlength="200" placeholder="Mis. pengecoran pelat lantai 3, zona B"></textarea></label>
    ${jenis.length ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label class="field">Mulai<input type="time" id="mulai" value="${now}"></label>
      <label class="field">Selesai<input type="time" id="selesai"></label></div>
    <p class="hint" id="lama" style="margin:0"></p>` : ''}
    <div class="msg" id="lm"></div>
    <button class="btn main" id="ya" type="button">Simpan lembur</button><button class="btn sec" data-tutup type="button">Batal</button>`);
  const menit = v => /^\d{2}:\d{2}$/.test(v) ? Number(v.slice(0, 2)) * 60 + Number(v.slice(3)) : null;
  const lama = () => { const a = menit($('mulai').value), b = menit($('selesai').value); return a == null || b == null ? null : (b - a + 1440) % 1440; };
  const tulisLama = () => { const l = lama(); $('lama').textContent = l ? `Lama lembur: ${Math.floor(l / 60)} jam${l % 60 ? ' ' + (l % 60) + ' menit' : ''}${menit($('selesai').value) < menit($('mulai').value) ? ' (lewat tengah malam — boleh absen pulang setelah 00.00 sampai ' + titik(A.pulangMalam || A.buka || '05:30') + ')' : ''}${A.setujuMaks && (menit($('selesai').value) < menit($('mulai').value) || l > A.setujuMaks * 60) ? ' · Perlu persetujuan atasan.' : ''}${A.jedaLembur ? ' Setelah absen pulang, absen masuk berikutnya baru bisa ' + A.jedaLembur + ' jam kemudian.' : ''}` : ''; };
  if (jenis.length) { $('mulai').oninput = tulisLama; $('selesai').oninput = tulisLama; }
  $('ya').onclick = () => {
    const k = $('ket').value.trim();
    if (jenis.length && !$('jenis').value) return void ($('lm').textContent = 'Pilih jenis lembur.');
    if (k.length < 5) return void ($('lm').textContent = 'Tulis keterangan lembur (minimal 5 huruf).');
    let data = k;
    if (jenis.length) {
      if (!$('mulai').value || !$('selesai').value) return void ($('lm').textContent = 'Isi jam mulai dan jam selesai.');
      const l = lama();
      if (!l) return void ($('lm').textContent = 'Jam selesai harus berbeda dari jam mulai.');
      if (l > 12 * 60) return void ($('lm').textContent = 'Lebih dari 12 jam. Periksa jam mulai dan selesai.');
      data = { jenis: $('jenis').value, ket: k, mulai: $('mulai').value, selesai: $('selesai').value };
    }
    sibuk($('ya'), true);
    ambilLokasi(6000).then(lok => api('absenLembur', DEV, ID, data, lok)).then(r => {
      tutupLembar(); toast(`Lembur tercatat${r.durasi ? ' (' + String(r.durasi).replace('.', ',') + ' jam)' : ''}.${r.diLokasi === false ? ' Lokasi Anda tidak di proyek: jangan lupa absen pulang.' : ''}`);
      return muat().then(() => lembarAjuan(r.ajuan, 'Lembur tercatat. Minta persetujuan atasan'));
    }).catch(e => { sibuk($('ya'), false); $('lm').textContent = kode(e).teks; });
  };
}

/* ---------- Bantuan ---------- */
function kirim(btn, panggil, sukses) {
  sibuk(btn, true);
  panggil().then(r => { tutupLembar(); toast(sukses(r)); return muat(); })
    .catch(e => { sibuk(btn, false); const t = kode(e).teks; if ($('lm')) $('lm').textContent = t; else toast(t, 6000); });
}
function sibuk(btn, on) {
  if (!btn) return;
  if (on) { btn.dataset.teks = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>Mengirim…'; btn.disabled = true; }
  else if (btn.dataset.teks) { btn.innerHTML = btn.dataset.teks; btn.disabled = false; }
}
function bukaLembar(html) { $('panel').innerHTML = html; $('sheet').hidden = false; }
function tutupLembar() { $('sheet').hidden = true; $('panel').innerHTML = ''; }
$('sheet').addEventListener('click', e => { if (e.target === $('sheet') || e.target.closest('[data-tutup]')) tutupLembar(); });
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const isoKe = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const keIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const tambahHari = (iso, n) => keIso(new Date(isoKe(iso).getTime() + n * 864e5));
const tglPanjang = iso => { if (!iso) return ''; const d = isoKe(iso); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };

document.addEventListener('visibilitychange', () => { if (CFG && !document.hidden && ID && $('sheet').hidden) muat(); });
setInterval(() => { if (CFG && !document.hidden && ID && $('sheet').hidden) muat(); }, 60000);
/* ---------- Halaman persetujuan lembur untuk atasan (?lembur=kode) ---------- */
const KODE_LEMBUR = (new URLSearchParams(location.search).get('lembur') || '').toLowerCase();
function kartuLembur(x, utama) {
  const jam = x.mulai ? `${esc(titik(x.mulai))}–${esc(titik(x.selesai))}${x.durasi !== '' ? ` (${String(x.durasi).replace('.', ',')} jam)` : ''}` : '-';
  return `<div class="card" style="margin:0 0 12px">
    <div style="font-weight:700;font-size:${utama ? 20 : 17}px">${esc(x.nama)}</div>
    <div class="hint" style="margin:0 0 8px">${esc(x.jabatan)} · ${esc(x.tanggal)}</div>
    ${x.jenis ? `<div><b>Jenis:</b> ${esc(x.jenis)}</div>` : ''}
    <div><b>Pekerjaan:</b> ${esc(x.ket)}</div>
    <div><b>Jam:</b> ${jam}</div>
    <div class="hint" style="margin:6px 0 0">Diajukan ${esc(x.kirim)}${x.lokasi ? ' · ' + esc(x.lokasi) : ''}</div>
    ${x.setuju && x.setuju !== 'Menunggu' ? `<p style="margin:8px 0 0"><b>${esc(x.setuju)}</b>${x.diputuskan ? ' · ' + esc(x.diputuskan) : ''}${x.catatan ? '<br>Catatan: ' + esc(x.catatan) : ''}</p>` : ''}
    ${!utama && x.setuju === 'Menunggu' ? `<button class="btn sec" style="min-height:44px;margin:10px 0 0" type="button" data-putus="${esc(x.kode)}">Putuskan</button>` : ''}
  </div>`;
}
function formPutuskan(x) {
  bukaLembar(`<h2>Lembur ${esc(x.nama)}</h2>
    <p style="margin:0 0 10px">${esc(x.jenis ? x.jenis + ' · ' : '')}${esc(x.ket)}<br><b>${esc(titik(x.mulai || ''))}${x.selesai ? '–' + esc(titik(x.selesai)) : ''}</b> · ${esc(x.tanggal)}</p>
    <label class="field">Catatan (wajib bila ditolak)<textarea id="cat" maxlength="200"></textarea></label>
    <div class="msg" id="lm"></div>
    <button class="btn main" id="bSetuju" type="button" style="background:#2e9a5b">Setujui</button>
    <button class="btn sec" id="bTolak" type="button">Tolak</button>`);
  const putus = (kep, btn) => {
    const c = $('cat').value.trim();
    if (kep === 'Ditolak' && c.length < 3) return void ($('lm').textContent = 'Tulis alasan penolakan.');
    sibuk(btn, true);
    api('putuskanLembur', DEV, x.kode, kep, c).then(r => { tutupLembar(); toast(`Lembur ${r.nama} ${r.keputusan.toLowerCase()}.`); muatSetuju(); })
      .catch(e => { sibuk(btn, false); $('lm').textContent = pesan(e); });
  };
  $('bSetuju').onclick = () => putus('Disetujui', $('bSetuju'));
  $('bTolak').onclick = () => putus('Ditolak', $('bTolak'));
}
function muatSetuju() {
  $('loading').hidden = false; $('loading').textContent = 'Memuat pengajuan lembur…';
  $('proj').textContent = 'Persetujuan lembur'; $('jam').textContent = '';
  return api('lemburAtasan', DEV, KODE_LEMBUR).then(d => {
    $('loading').hidden = true;
    let box = $('setuju');
    if (!box) { box = document.createElement('section'); box.id = 'setuju'; $('loading').after(box); }
    const x = d.item;
    let h = `<h2 style="margin:0 0 12px">Pengajuan lembur</h2>` + kartuLembur(x, true);
    if (!d.boleh) h += `<p class="msg" style="margin:0 0 12px">${esc(d.alasan)}</p>`;
    else if (x.setuju === 'Menunggu') h += `<button class="btn main" id="bPutus" type="button" style="background:#2e9a5b">Setujui / Tolak</button>`;
    if (d.boleh && d.menunggu.length) h += `<h2 style="margin:22px 0 10px">Pengajuan lain menunggu (${d.menunggu.length})</h2>` + d.menunggu.map(m => kartuLembur(m, false)).join('');
    if (d.boleh) h += `<p class="hint" style="margin:16px 0 0">Masuk sebagai ${esc(d.atasan)}.</p>`;
    box.innerHTML = h;
    if ($('bPutus')) $('bPutus').onclick = () => formPutuskan(x);
    box.querySelectorAll('[data-putus]').forEach(b => { b.onclick = () => formPutuskan(d.menunggu.filter(m => m.kode === b.dataset.putus)[0]); });
  }).catch(e => { $('loading').innerHTML = `<p class="msg">${esc(pesan(e))}</p><button class="btn sec" type="button" onclick="muatSetuju()">Coba lagi</button>`; });
}
function mulai() {
  $('loading').hidden = false; $('loading').textContent = 'Memuat…';
  api('absenKonfig').then(c => { CFG = c; A = c.aturan; $('proj').textContent = c.judul; muat(); })
    .catch(e => { $('loading').innerHTML = `<p class="msg">${esc(pesan(e))}</p><button class="btn sec" type="button" onclick="mulai()">Coba lagi</button>`; });
}
if (KODE_LEMBUR) muatSetuju(); else mulai();
</script>
